[project]
name = "taosc-llm"
version = "0.1.0"
description = "Prepare, evaluate and refine ERM binary guards with isolated Pi sessions"
readme = "README.md"
authors = [
    { name = "hsh814", email = "shhan@unist.ac.kr" }
]
requires-python = ">=3.10"
dependencies = ["binradar>=0.2.0"]

[project.scripts]
taosc-llm = "taosc_llm.cli:main"
taosc-llm-setup = "taosc_llm.cli:setup_main"
taosc-llm-evaluate = "taosc_llm.cli:evaluate_main"
taosc-llm-fixture = "taosc_llm.fixture:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taosc_llm = ["runtime.c", "pi/adapter.mjs", "prompts/system.txt"]

[tool.uv.sources]
binradar = { path = "../..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
